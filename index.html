<meta charset="utf-8">
    <title>Image OCR with Tesseract.js</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <div class="card bg-white shadow-md rounded-lg p-6">
            <h1 class="text-2xl font-semibold mb-4">Image OCR Web App</h1>
            <div class="mb-4">
                <label for="imageInput" class="block mb-2 text-sm font-medium text-700">Select an image</label>
                <input type="file" id="imageInput" accept="image/*" class="p-2 border rounded-lg w-full">
            </div>
            <div class="mb-4">
                <button onclick="performOCR()" class="btn-primary w-full py-2 px-4 bg-blue-600 text-white rounded">Perform OCR</button>
            </div>
            <div id="result" class="bg-white p-4 rounded-lg shadow-md"></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.2/tesseract.min.js"></script>
    <script src="script.js"></script>
    <script>
        function performOCR() {
            const input = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            if (!input.files || input.files.length === 0) {
                resultDiv.textContent = 'Please select an image file.';
                return;
            }
            const file = input.files[0];
            resultDiv.textContent = 'Processing...';
            Tesseract.recognize(file, 'eng', { logger: m => console.log(m) })
                .then(({ data: { text } }) => {
                    resultDiv.textContent = text;
                })
                .catch(err => {
                    resultDiv.textContent = 'Error: ' + err.message;
                });
        }
    </script>
</body>
</html>
