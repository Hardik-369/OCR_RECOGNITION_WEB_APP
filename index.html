<meta charset="utf-8">
<title>Image OCR with Tesseract.js</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">
<div class="container mx-auto p-4">
<div class="card bg-white p-6 rounded-lg shadow-md">
<h1 class="text-2xl font-semibold mb-4">Image OCR Web App</h1>
<div class="mb-4">
<input type="file" id="imageInput" accept="image/*" class="p-2 border rounded-lg w-full">
</div>
<div class="mb-4">
<button id="ocrButton" class="btn-primary w-full">Perform OCR</button>
</div>
<div id="result" class="bg-white p-4 rounded-lg shadow-md"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.2/tesseract.min.js"></script>
<script>
document.getElementById('ocrButton').addEventListener('click', performOCR);
async function performOCR() {
    const input = document.getElementById('imageInput');
    const resultDiv = document.getElementById('result');
    resultDiv.textContent = '';
    if (!input.files || input.files.length === 0) {
        resultDiv.textContent = 'Please select an image file.';
        return;
    }
    const file = input.files[0];
    const worker = Tesseract.createWorker({
        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4.1.2/dist/worker.min.js',
        logger: m => console.log(m)
    });
    try {
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        const { data } = await worker.recognize(file);
        resultDiv.textContent = data.text;
    } catch (err) {
        console.error(err);
        resultDiv.textContent = 'An error occurred during OCR.';
    } finally {
        await worker.terminate();
    }
}
</script>
</body>
</html>
